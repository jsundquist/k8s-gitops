apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sbom
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/jsundquist/k8s-gitops
    targetRevision: main
    path: apps/sbom
  destination:
    server: https://kubernetes.default.svc
    namespace: sbom
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
