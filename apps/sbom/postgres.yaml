apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: sbom-postgres
spec:
  selector:
    app: sbom-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: sbom-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app: sbom-postgres
  template:
    metadata:
      labels:
        app: sbom-postgres
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        # Pinned by digest (the multi-arch index for postgres:16). Bump it deliberately, see docs/sbom.md.
        image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: sbom
        - name: POSTGRES_DB
          value: sbom
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sbom-db
              key: postgres-password
        # A subdirectory, because the volume root contains lost+found.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "sbom", "-d", "sbom"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "sbom", "-d", "sbom"]
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      # k3s default StorageClass (local-path): data lives on the droplet's disk.
      resources:
        requests:
          storage: 5Gi
