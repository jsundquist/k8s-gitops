apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbom
  annotations:
    # Staging first, to avoid Let's Encrypt rate limits. Switch to letsencrypt-prod once it issues.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - sbom.digital-portfolio.net
    secretName: sbom-tls
  rules:
  - host: sbom.digital-portfolio.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              name: http
