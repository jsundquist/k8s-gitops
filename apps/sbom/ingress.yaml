apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbom
  annotations:
    # Production issuer. Use letsencrypt-staging when testing changes to avoid rate limits.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - sbom.digital-portfolio.net
    secretName: sbom-tls
  rules:
  - host: sbom.digital-portfolio.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              name: http
