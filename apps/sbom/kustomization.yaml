apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: 3212a55-27
    digest: sha256:088a8d43fb8077e77474aaaba17aacd14420e85bb321511d5c4bac7491277b6d
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: 3212a55-27
    digest: sha256:105985af47e90d620504d8540a6bfe8d042de9337eb4f212ba223e04f89b58e6
