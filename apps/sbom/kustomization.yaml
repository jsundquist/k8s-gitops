apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: c3b235c-31
    digest: sha256:676739d7de20fd83591d74b529dc0126bc1ff29a75776e36d2fae6ad7bd5f69c
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: c3b235c-31
    digest: sha256:3258d935869d62b2bd35b21dee9cfb26196a5b3bfdc3d4ad10565ffecf6a9f62
