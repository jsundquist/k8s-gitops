apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: 8518fc1-28
    digest: sha256:97406830051b1b52d8c641b1d222cf947568e6f112ddb8ff155f66831bf59a8a
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: 8518fc1-28
    digest: sha256:d929960e43f5b79e326683577b4725d0313aeaacd2d4b8dc502ce50dcbbc0600
