apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: a07c39e-32
    digest: sha256:f1558acf4ed5d95e381b7a23542725b2e5b2f1a2c14e56a2e0588c8c0dbcae4b
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: a07c39e-32
    digest: sha256:a2ffd22bc34bf5a2a6da4b52e8c8f01d193e892760f95019ebe2999f144bb79c
