apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: 4318341-48
    digest: sha256:5cef7bf8f3f98b9cc4040611bdae7fabc8090cc4dfe04c7113822a6224d58e90
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: 4318341-48
    digest: sha256:97fe59ba8974cec0a7b4e0d138dfbca75e17f07e72f62fe83c099b6a293cda83
