apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: 210a2f6-21
    digest: sha256:8e879c17f8bad57c9d5429bbdcc52cf059059a74cf52a86bc5cb2d1c5864cf85
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: 210a2f6-21
    digest: sha256:d9f18b2ad8182574642190e3c4fec7912a635e3bd2c5663d9384254aa3e6c88f
