apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: 6cfe20c-16
    digest: sha256:cdc4ef0e442df146d4b8aa2f8fdfa30fc9d8eac38601d9e022186364b8df941a
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: 6cfe20c-16
    digest: sha256:14ebe93ea8ea4e74dbf255d67d35a116e616962730b0afa4675a2d57e25c9bd7
