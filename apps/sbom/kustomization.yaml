apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - sealed-db.yaml
  - sealed-app.yaml
  - sealed-backup.yaml
  - backup.yaml
  - postgres.yaml
  - migrate.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - limitrange.yaml
# Create the sealed secrets before everything that reads them.
patches:
  - target:
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
# The sbom repo's release workflow publishes both images with the same tag and bumps both here.
# Keep the web entry first and do not hand-edit the tags: the bump job addresses them by position and name.
images:
  - name: ghcr.io/jsundquist/sbom
    newTag: ea500cd-29
    digest: sha256:5845e6ddf874df914c72ecca729f305dce0461be1d322f4b2e3e9c073a1f1ffa
  - name: ghcr.io/jsundquist/sbom-worker
    newTag: ea500cd-29
    digest: sha256:d113b4b1f64676440e2a2757e1ed7c4fcdd1a1d5ef988b73ef44d945d1fff77a
