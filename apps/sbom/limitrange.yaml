# Backstop: a container that forgets its own requests and limits still gets bounded.
# Every workload here sets its own values, so these only apply to future or temporary pods.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 10m
      memory: 64Mi
    default:
      memory: 256Mi
